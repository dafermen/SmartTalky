name: Compilación iOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ios.yml'
      - 'apps/web/**'
      - 'capacitor.config.ts'
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**'
      - 'scripts/check-capacitor-*.mjs'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: Xcode sin firma
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Registrar herramientas de Apple
        run: |
          sw_vers
          xcodebuild -version

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Construir y sincronizar iOS
        run: npm run mobile:sync:ios

      - name: Compilar para el simulador sin firma
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
